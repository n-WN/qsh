[package]
name = "qsh"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A durable remote terminal over QUIC: roaming, native scrollback, kitty graphics, clipboard and file transfer."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
hex = "0.4"
libc = "0.2"
nix = { version = "0.31", features = ["term", "process", "signal", "fs", "ioctl", "user", "hostname"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
vt100 = "0.18"
base64 = "0.22"
socket2 = "0.6.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSArray", "NSDictionary", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
